[package]
name = "seedling"
version = "0.10.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.89"

[[bin]]
name = "seedling"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# The server every edition runs, and the crates of brig·id it is made of
# (git dependencies pointing to the core repository).
brigid-server = { git = "https://github.com/brig-id/core", rev = "deb9fc47da940ed0c833a2515898698b2a6755c3", package = "brigid-server" }

clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
# `seedling init` checks the domain it is given (src/machine.rs).
url = "2"

# A static (musl) build carries its own OpenSSL: the system's is not there to
# link to. OpenSSL is reached only by the attestation code of webauthn-rs,
# which brig·id never runs (attestation "none"); the linked code is still
# audited like the rest.
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
brigid-ui-embed = { git = "https://github.com/brig-id/core", rev = "deb9fc47da940ed0c833a2515898698b2a6755c3", package = "brigid-ui-embed" }

[dev-dependencies]
# Re-open the database a test server wrote (tests/binary.rs).
brigid-store = { git = "https://github.com/brig-id/core", rev = "deb9fc47da940ed0c833a2515898698b2a6755c3", package = "brigid-store" }
brigid-crypto = { git = "https://github.com/brig-id/crypto", tag = "v0.1.0" }
# The interface as the server serves it (tests/static_files.rs) and the JSON
# the tests read.
axum = "0.8"
serde_json = "1"
figment = { version = "0.10", features = ["test"] }
http-body-util = "0.1"
tempfile = "3"
# Reads the payload of an ID token in the relying-party smoke test.
base64ct = { version = "1", features = ["alloc"] }
tower = { version = "0.5", features = ["util"] }

# E2E smoke tests (tests/smoke.rs) — real HTTP against a spawned `seedling`
# subprocess, exercising a full WebAuthn ceremony via a software passkey.
reqwest = { version = "0.13", features = ["json"] }
# The same version as brig-id/core, which holds the server side of the
# ceremony: these move when the core moves, not by themselves
# (.github/dependabot.yml).
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
panic = "abort"
