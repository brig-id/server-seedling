[package]
name = "seedling"
version = "0.7.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.89"

[[bin]]
name = "seedling"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# brig·id core crates (git dep pointing to the core repository)
brigid-api = { git = "https://github.com/brig-id/core", rev = "be3b57f161587e113ce25da3a9e56b85f21ff80e", package = "brigid-api" }
brigid-store = { git = "https://github.com/brig-id/core", rev = "be3b57f161587e113ce25da3a9e56b85f21ff80e", package = "brigid-store" }
brigid-identity = { git = "https://github.com/brig-id/core", rev = "be3b57f161587e113ce25da3a9e56b85f21ff80e", package = "brigid-identity" }
brigid-webauthn = { git = "https://github.com/brig-id/core", rev = "be3b57f161587e113ce25da3a9e56b85f21ff80e", package = "brigid-webauthn" }
brigid-oidc = { git = "https://github.com/brig-id/core", rev = "be3b57f161587e113ce25da3a9e56b85f21ff80e", package = "brigid-oidc" }

# Cryptographic primitives
brigid-crypto = { git = "https://github.com/brig-id/crypto", tag = "v0.1.0" }

# CLI + configuration
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# HTTP / TLS
axum = "0.8"
axum-server = { version = "0.9", features = ["tls-rustls"] }
tower-http = { version = "0.7", features = ["set-header"] }
# The embedded interface is compressed at build time (`build.rs`); a client
# that takes no compression gets it unpacked.
flate2 = "1"
# Only used to install a default process-wide `CryptoProvider` at startup —
# see the call site in main.rs for why this is needed.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# Misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
time = "0.3"
# geteuid, and dropping root for a command typed on the machine (src/machine.rs).
libc = "0.2"

# A static (musl) build carries its own OpenSSL: the system's is not there to
# link to. OpenSSL is reached only by the attestation code of webauthn-rs,
# which brig·id never runs (attestation "none"); the linked code is still
# audited like the rest.
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
flate2 = "1"

[dev-dependencies]
figment = { version = "0.10", features = ["test"] }
http-body-util = "0.1"
tempfile = "3"
# Reads the payload of an ID token in the relying-party smoke test.
base64ct = { version = "1", features = ["alloc"] }
tower = { version = "0.5", features = ["util"] }

# E2E smoke tests (tests/smoke.rs) — real HTTP against a spawned `seedling`
# subprocess, exercising a full WebAuthn ceremony via a software passkey.
reqwest = { version = "0.13", features = ["json"] }
# The same version as brig-id/core, which holds the server side of the
# ceremony: these move when the core moves, not by themselves
# (.github/dependabot.yml).
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
panic = "abort"
