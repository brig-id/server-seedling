[package]
name = "seedling"
# The version of a release is its tag: the release build writes it here before
# compiling (scripts/set-version.sh). Any other build says 0.0.0.
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.94"

[[bin]]
name = "seedling"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# The server every edition runs, and the crates of brig·id it is made of:
# the core at a commit of its main, which Cargo.lock holds. `cargo update -p
# brigid-server` follows a newer one (the three crates move together).
brigid-server = { git = "https://github.com/brig-id/core", branch = "main", package = "brigid-server" }

clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
# `seedling init` checks the domain it is given (src/machine.rs).
url = "2"

[build-dependencies]
brigid-ui-embed = { git = "https://github.com/brig-id/core", branch = "main", package = "brigid-ui-embed" }

[dev-dependencies]
# Re-open the database a test server wrote (tests/binary.rs).
brigid-store = { git = "https://github.com/brig-id/core", branch = "main", package = "brigid-store" }
# The interface as the server serves it (tests/static_files.rs) and the JSON
# the tests read.
axum = "0.8"
serde_json = "1"
figment = { version = "0.10", features = ["test"] }
http-body-util = "0.1"
tempfile = "3"
# Reads the payload of an ID token in the relying-party smoke test.
base64ct = { version = "1", features = ["alloc"] }
tower = { version = "0.5", features = ["util"] }

# E2E smoke tests (tests/smoke.rs) — real HTTP against a spawned `seedling`
# subprocess, exercising a full WebAuthn ceremony via a software passkey.
reqwest = { version = "0.13", features = ["json"] }
# The same version as brig-id/core, which holds the server side of the
# ceremony: these move when the core moves, not by themselves.
webauthn-authenticator-rs = { version = "0.6", features = ["softpasskey"] }
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.6"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
panic = "abort"
