name: CI

on:
  push:
    branches: [main, "dev/*"]
  pull_request:
    branches: [main, "dev/*"]
  workflow_dispatch:
  # The build of a release (release.yml): the same jobs, with the version of
  # the tag about to be made written into what is built.
  workflow_call:
    inputs:
      version:
        description: The version being released (X.Y.Z); empty for an ordinary build.
        type: string
        default: ""

permissions:
  contents: read

env:
  # The interface embedded in the server: brig-id/app at a commit of its main,
  # so that two builds of the same server commit embed the same interface. The
  # pull request that needs a newer interface moves it (the integration job
  # refuses a commit that is not on the interface's main).
  APP_REF: a6fbc98615825c8830ad9af36471acc3126e87c9

jobs:
  ci:
    uses: brig-id/.github/.github/workflows/ci-rust.yml@main
    with:
      working-directory: .

  security:
    uses: brig-id/.github/.github/workflows/security-audit.yml@main
    with:
      working-directory: .

  coverage:
    # Not again for a release: it measures, it does not check.
    if: inputs.version == ''
    uses: brig-id/.github/.github/workflows/coverage.yml@main
    with:
      working-directory: .
      codecov-flags: server-seedling
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # This server, as it ships (the core and crypto of Cargo.lock, the interface
  # of APP_REF), driven in a browser: the interface's suite and the
  # demonstration site's (brig-id/.github, integration.yml). A branch of the
  # same name with an open pull request in the core, crypto, the interface or
  # the demo is taken instead: the change is tested whole before it is merged.
  integration:
    uses: brig-id/.github/.github/workflows/integration.yml@main
    with:
      heads: false

  docker:
    # Its own job, not a reusable workflow of brig-id/.github: checks that
    # the production Dockerfile still builds with the real interface
    # (brig-id/app) embedded, not just the ui/.gitkeep placeholder. The
    # interface builds from the public npm registry, with no secret.
    # Build-only: nothing is pushed here.
    name: Docker build (seedling + app UI embedded)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout server-seedling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout app (Qwik UI)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: brig-id/app
          ref: ${{ env.APP_REF }}
          path: ui

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: seedling:ci

      - name: The image starts and serves its interface
        run: scripts/check-image.sh seedling:ci

  # -- The release: static binaries, and the image made of them -------------

  ui:
    # The interface, built once for both binaries.
    name: Interface (brig-id/app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: brig-id/app
          ref: ${{ env.APP_REF }}
          path: ui

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"
          working-directory: ui

      - name: Build
        working-directory: ui
        env:
          # In a release, the interface says the version of the server it is
          # part of.
          BRIGID_INTERFACE_VERSION: ${{ inputs.version }}
        run: pnpm build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist/
          if-no-files-found: error

  binaries:
    # Static (musl) executables, each built natively on its own
    # architecture: they link nothing, so they run on any Linux, with or
    # without a C library or OpenSSL (vendored, Cargo.toml).
    name: Static binary (${{ matrix.arch }})
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker: amd64
            runner: ubuntu-latest
          - arch: aarch64
            docker: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - name: Checkout server-seedling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui-dist

      - name: The version of the release
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/set-version.sh "$VERSION"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-08-05
        with:
          toolchain: stable
          targets: ${{ env.TARGET }}

      - name: Install the musl toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-musl-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-musl-

      - name: Build
        env:
          BRIGID_UI_DIST: ${{ github.workspace }}/ui-dist
        run: |
          export "CC_$(echo "$TARGET" | tr '-' '_')=musl-gcc"
          cargo build --release --locked --target "$TARGET"
          mkdir -p out
          cp "target/$TARGET/release/seedling" out/seedling

      - name: It is static, says its version, and runs where nothing else is
        run: |
          file out/seedling
          file out/seedling | grep -Eq "static(-pie)? linked|statically linked"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | sed -n 1p)
          test "$(out/seedling --version)" = "seedling $version"
          # Alpine: musl, and no OpenSSL. A server there answers. As an
          # ordinary user: seedling refuses to run as root.
          docker run -d --name bare --user 65532:65532 -p 18080:8080 -v "$PWD/out:/b:ro" \
            -e BRIGID_MASTER_KEY=0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0 \
            -e BRIGID_SERVER__DOMAIN=localhost -e BRIGID_SERVER__HOST=0.0.0.0 \
            -e BRIGID_DATABASE__PATH=/tmp/brigid.db \
            alpine:3.22 /b/seedling
          for _ in $(seq 1 30); do curl -fsS http://localhost:18080/health > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://localhost:18080/health || { docker logs bare; exit 1; }
          docker exec bare sh -c 'ls /usr/lib/libssl* /lib/libssl* 2>/dev/null' && { echo "OpenSSL is in the image after all"; exit 1; }
          docker rm -f bare

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seedling-${{ matrix.docker }}
          path: out/seedling
          if-no-files-found: error

  image:
    # The released image, made of the two binaries above: built on every
    # change, so that a release never meets it for the first time.
    name: Release image (from the static binaries)
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server-seedling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: seedling-*
          path: artifacts

      - name: The build context
        run: |
          mkdir -p bin/data
          for arch in amd64 arm64; do
            cp "artifacts/seedling-$arch/seedling" "bin/seedling-$arch"
          done
          ls -la bin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (amd64, to run it)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64
          load: true
          tags: seedling:release

      - name: The image starts and serves its interface
        run: scripts/check-image.sh seedling:release

      - name: Build (both architectures)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: false

  # -- The installation guide, followed on a fresh machine ------------------

  guide-tests:
    # The checks of the guide job, built once beside the binaries: the guide
    # as a script, and the sign-in on the installed server
    # (tests/install_guide.rs).
    name: Guide checks (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server-seedling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-08-05
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-guide-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-guide-tests-

      - name: Build
        run: |
          exe=$(cargo test --locked --no-run --test install_guide --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "install_guide" and .profile.test) | .executable')
          test -x "$exe"
          mkdir -p out
          cp "$exe" out/install_guide

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-guide-tests
          path: out/install_guide
          if-no-files-found: error

  guide:
    # docs/install.md from start to end, on the runner itself (Ubuntu, with
    # systemd and sudo): every block it marks `run`, in order, then what it
    # promises, up to a person signed in on the site it registered
    # (scripts/run-guide.sh). The download is this build's binary, served on
    # the machine with its SHA256SUMS. release.yml follows it once more, with
    # the release just published.
    name: Installation guide, followed on a fresh machine
    needs: [binaries, guide-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server-seedling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seedling-amd64
          path: artifacts/binary

      - name: The checks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-guide-tests
          path: artifacts/tests

      - name: The version of the release
        # The guide's script compares what the binary says with Cargo.toml.
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/set-version.sh "$VERSION"

      - name: Follow docs/install.md
        run: |
          chmod +x artifacts/tests/install_guide
          scripts/run-guide.sh artifacts/tests/install_guide artifacts/binary/seedling
